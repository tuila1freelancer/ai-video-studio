# A server anyone can start. Build with the key as a secret:
#   export AVS_APP_KEY=$(openssl rand -hex 32)
#   DOCKER_BUILDKIT=1 docker compose build
#   docker compose up -d
services:
  avs:
    build:
      context: .
      secrets: [appkey]
      # A fresh id per build, or a cached bytecode layer keeps the PREVIOUS key while the launcher
      # gets the new one, and the image cannot decrypt itself.
      args:
        BUILD_ID: ${BUILD_ID:-${AVS_APP_KEY:-dev}}
    image: avs:latest
    restart: unless-stopped
    ports: ['127.0.0.1:8123:8123']
    volumes:
      - avs-data:/data
    environment:
      # Minted inside the container once: docker compose exec avs /usr/local/bin/node \
      #   /app/app-payload/loader.cjs is NOT how — tokens are made with the repo's npm run token on
      #   the machine that holds the database, or by mounting a data dir that already has one.
      AVS_LICENSE_KEY: ${AVS_LICENSE_KEY:-}
      AVS_DEVICE_ID: ${AVS_DEVICE_ID:-}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # Chromium needs no privileges it cannot be given inside a hardened container.
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    shm_size: '1gb'
volumes:
  avs-data:
secrets:
  appkey:
    environment: AVS_APP_KEY
