<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- AI Video Studio app icon — "Studio Pro" identity by TuiLa1Freelancer.
       Squircle 824px on 1024 canvas (Apple grid), indigo→violet brand, play glyph
       + orbit comet arc + sparkles. Rendered to AppIcon.icns by scripts/build-icon.mjs -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26264c"/>
      <stop offset=".45" stop-color="#131329"/>
      <stop offset="1" stop-color="#0a0a16"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".26" r=".8">
      <stop offset="0" stop-color="#6d5cff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#6d5cff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#6d5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#b04df7"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- luminance mask of the play glyph: fill+stroke overlap stays uniform white,
         so the semi-transparent sheen below never double-composites along the path edge -->
    <mask id="glyphM" maskUnits="userSpaceOnUse" x="280" y="268" width="490" height="490">
      <g transform="translate(524,512)">
        <path d="M-95 -140 L165 0 L-95 140 Z" fill="#ffffff" stroke="#ffffff" stroke-width="90" stroke-linejoin="round"/>
      </g>
    </mask>
    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05050c" stop-opacity="0"/>
      <stop offset="1" stop-color="#05050c" stop-opacity=".5"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- squircle body + baked macOS-style shadow -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#drop)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#halo)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glare)"/>
    <rect x="100" y="540" width="824" height="384" fill="url(#vign)"/>
  </g>
  <rect x="106" y="106" width="812" height="812" rx="180" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="4"/>

  <!-- orbit comet arc: indigo → cyan, ending in a glowing orb -->
  <path d="M 299.9 299.9 A 300 300 0 0 1 801.8 589.6" fill="none" stroke="url(#arc)" stroke-width="30" stroke-linecap="round" opacity=".92"/>
  <circle cx="801.8" cy="589.6" r="44" fill="#22d3ee" filter="url(#soft)" opacity=".5"/>
  <circle cx="801.8" cy="589.6" r="22" fill="#8ff4ff"/>

  <!-- play glyph: rounded triangle, brand gradient, glossy top via masked sheen -->
  <g transform="translate(524,512)">
    <path d="M-95 -140 L165 0 L-95 140 Z" fill="url(#brand)" stroke="url(#brand)" stroke-width="90" stroke-linejoin="round" filter="url(#glow)" opacity=".7"/>
    <path d="M-95 -140 L165 0 L-95 140 Z" fill="url(#brand)" stroke="url(#brand)" stroke-width="90" stroke-linejoin="round"/>
  </g>
  <rect x="280" y="268" width="490" height="490" fill="url(#sheen)" mask="url(#glyphM)"/>

  <!-- sparkles -->
  <g transform="translate(768,220)" fill="#ffffff" opacity=".95">
    <path d="M0 -40 C3.6 -11.5 11.5 -3.6 40 0 C11.5 3.6 3.6 11.5 0 40 C-3.6 11.5 -11.5 3.6 -40 0 C-11.5 -3.6 -3.6 -11.5 0 -40 Z"/>
  </g>
  <g transform="translate(292,724) scale(.5)" fill="#9be9ff" opacity=".9">
    <path d="M0 -40 C3.6 -11.5 11.5 -3.6 40 0 C11.5 3.6 3.6 11.5 0 40 C-3.6 11.5 -11.5 3.6 -40 0 C-11.5 -3.6 -3.6 -11.5 0 -40 Z"/>
  </g>
</svg>
