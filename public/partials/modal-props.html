<div class="modal-bg" id="propsModal" role="dialog" aria-modal="true">
  <div class="modal">
    <h2><span data-i18n="ui.propsModal.sua-noi-dung-canh">✏️ Sửa nội dung cảnh</span> <button class="x" data-close>×</button></h2>
    <div class="field"><label class="label" for="propHeading" data-i18n="ui.propsModal.heading-chu-lon">Heading (chữ lớn)</label><input class="input" id="propHeading"></div>
    <div class="field"><label class="label" for="propSub" data-i18n="ui.propsModal.sub-mo-ta">Sub / mô tả</label><input class="input" id="propSub"></div>
    <div class="field"><label class="label" for="propLabel" data-i18n="ui.propsModal.label-nho-hud">Label nhỏ (HUD)</label><input class="input" id="propLabel"></div>
    <details><summary class="hint pointer" data-i18n="ui.propsModal.props-json-nang-cao">⚙️ Props JSON (nâng cao)</summary>
      <textarea class="input mt-8" id="propJson" rows="6" style="font-family:ui-monospace,Menlo,monospace;font-size:11px"></textarea>
    </details>
    <button class="btn primary block mt-12" id="propSave" data-i18n="ui.propsModal.luu-tao-preview">💾 Lưu + tạo preview</button>
  </div>
</div>
