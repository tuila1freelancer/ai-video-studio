<div class="modal-bg" id="imgViewer" role="dialog" aria-modal="true">
  <div class="modal iv">
    <h2><span data-i18n="ui.imgViewer.anh">🖼 Ảnh</span> <span class="iv-pos" id="ivPos"></span> <button class="x" data-close>×</button></h2>
    <div class="iv-stage">
      <button class="iv-nav prev" id="ivPrev" title="Ảnh trước (←)" data-i18n-title="ui.imgViewer.anh-truoc">‹</button>
      <img id="ivImg" alt="">
      <button class="iv-nav next" id="ivNext" title="Ảnh sau (→)" data-i18n-title="ui.imgViewer.anh-sau">›</button>
    </div>
    <div class="iv-cap" id="ivCap"></div>
    <div class="row mt-12">
      <button class="btn primary" id="ivAdd" data-i18n="ui.imgViewer.them-vao-assets">+ Thêm vào assets</button>
      <a class="btn" id="ivOpen" target="_blank" rel="noreferrer noopener" data-i18n="ui.imgViewer.mo-nguon">Mở nguồn ↗</a>
    </div>
  </div>
</div>
