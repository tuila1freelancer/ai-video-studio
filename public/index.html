       each padding around before. -->

    <div class="nav-brand">
      <span class="logo">🎬</span>
      <div class="nav-label">AI Video Studio<small>by TuiLa1Freelancer</small></div>
    </div>
    <div class="nav-items">
      <button class="nav-item active" data-page="home"><span class="ic">🏠</span><span class="nav-label" data-i18n="ui.app.trang-chu">Trang chủ</span></button>
      <button class="nav-item" data-page="studio"><span class="ic">🎬</span><span class="nav-label" data-i18n="ui.app.tao-video">Tạo Video</span></button>
      <button class="nav-item" data-page="library"><span class="ic">📚</span><span class="nav-label" data-i18n="ui.app.thu-vien">Thư viện</span></button>
      <button class="nav-item" data-page="brandgen"><span class="ic">🎨</span><span class="nav-label" data-i18n="ui.app.brand-asset">Ảnh Brand</span></button>
      <button class="nav-item" data-page="editvideo"><span class="ic">✂️</span><span class="nav-label" data-i18n="ui.app.edit-video">Sửa video</span></button>
      <button class="nav-item" data-page="tutorials"><span class="ic">📖</span><span class="nav-label" data-i18n="ui.app.huong-dan">Hướng dẫn</span></button>
    </div>
    <div class="nav-spacer"></div>
    <div class="row nav-channel" style="gap:6px">
      <select class="input" id="channelSelect" title="Kênh đang làm việc" data-i18n-title="ui.app.kenh-dang-lam-viec"></select>
      <button class="btn sm" id="btnManageChannels" title="Quản lý kênh" data-i18n-title="ui.app.quan-ly-kenh">⚙</button>
    </div>
    <!-- Tool status lives in AI Setting now. This stays as a WARNING only: silent is the normal
         state, but a missing Chrome or ffmpeg has to be visible or renders fail with no clue. -->
    <button class="dep-warn hidden" id="depWarn" title="Thiếu công cụ hệ thống — bấm để xem" data-i18n-title="ui.app.thieu-cong-cu-he-thong"></button>
    <!-- No data-i18n on the BUTTON: initNav() runs before applyDom() and fills it with an icon +
         a .nav-label span, which a textContent write would delete. nav.js tags that span instead. -->
    <button class="btn sm" id="navSettings" data-i18n-exempt>⚙️ AI Setting</button>
  </nav>
