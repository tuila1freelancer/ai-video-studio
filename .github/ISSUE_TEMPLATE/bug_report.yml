name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first. Security problems go through
        private reporting instead — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project with …
        2. Start the pipeline …
        3. …
    validations:
      required: true
  - type: textarea
    id: journal
    attributes:
      label: Processing journal or logs
      description: |
        For a failed run, attach the journal (Studio → Journal → Download). For a server issue,
        include the relevant lines of the server output. Remove API keys and personal data first.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` field of `GET /api/health`, or `version` in package.json.
      placeholder: 1.0.3
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (app)
        - Windows (app)
        - From source (npm start)
        - Server mode / Docker
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Node.js version when running from source, LLM and TTS providers involved.
