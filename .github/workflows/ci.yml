name: CI
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # hermetic subset: node:test suite + ffmpeg-backed QC tests. Network providers and
      # the puppeteer render smoke (vendored Chrome) stay local-only by design.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      # A hung test fails on its own instead of taking the job's whole budget with it; the
      # coverage summary is informational and lands in the step log.
      - run: node --test --test-timeout=120000 --experimental-test-coverage "tests/*.test.js"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reported, not enforced: a transitive advisory must not block a fix from landing.
      - run: npm audit --omit=dev || true

  # The kit is what an agent installs, and its promise is that it needs nothing installed. This job
  # therefore runs it on a bare checkout with NO npm ci — if a dependency ever creeps in, it fails
  # here rather than on somebody's machine.
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node packages/avs-kit/bin/avs.mjs --help
      - name: MCP handshake over stdio, with no engine and no dependencies
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node packages/avs-kit/bin/avs-mcp.mjs 2>/dev/null | grep -q '"avs_video_verdict"'
